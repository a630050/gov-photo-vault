<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>勘災報告照片挑選器</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { margin: 0; font-family: "Microsoft JhengHei", system-ui, sans-serif; background: #f4f6f9; color: #1e293b; }
    .pk-wrap { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
    .pk-main { display: flex; flex-direction: column; overflow: hidden; }
    .pk-bar { background: #0f172a; color: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .pk-filters { background: #fff; padding: 10px 16px; border-bottom: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pk-filters input, .pk-filters select { padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
    .pk-wall { flex: 1; overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--pk-tile, 190px), 1fr)); gap: 12px; align-content: start; }
    .pk-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s; }
    .pk-card.selected { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.2); }
    .pk-thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #e2e8f0; cursor: pointer; }
    .pk-meta { padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .pk-tray { background: #fff; border-left: 1px solid #cbd5e1; display: flex; flex-direction: column; overflow: hidden; }
    .pk-tray-head { padding: 12px; border-bottom: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .pk-tray-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .pk-tray-item { border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; background: #f8fafc; font-size: 12px; }
    .pk-tray-foot { padding: 12px; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
    .pk-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; background: #e0f2fe; color: #0369a1; }
    .pk-warn { background: #fef3c7; color: #92400e; }
    .pk-err { background: #fee2e2; color: #991b1b; }
    .pk-banner { padding: 8px 16px; font-size: 13px; background: #fef3c7; color: #92400e; border-bottom: 1px solid #fde68a; }
    .pk-pager { background: #fff; padding: 8px 16px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .pk-modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .pk-modal { background: #fff; border-radius: 10px; width: min(860px, 94vw); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .pk-modal-body { padding: 16px; overflow-y: auto; flex: 1; }
    .pk-modal-foot { padding: 12px 16px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 8px; }
    .pk-btn { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 5px; background: #fff; cursor: pointer; font-size: 13px; }
    .pk-btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    .pk-btn.danger { background: #dc2626; color: #fff; border-color: #dc2626; }
    .pk-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="picker-root">載入照片挑選器中…</div>
  <script src="/static/picker.js"></script>
</body>
</html>
